<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#4aa8ff">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Mes lettres ABC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: joyful, simple, big, for a 5-year-old; no reading required
   IDEA: a sky playground where letters are roads that little heroes drive along
   PICTURE: the big letter board itself, filling the screen
   COLOUR and TYPE: sky blue ground, sunny yellow, candy accents; Baloo 2 rounded
   LAYOUT: home = A to Z path of tiles; play = top bar + square board with step cards */
:root{--sky1:#5bb8ff;--sky2:#bfe6ff;--ink:#1d2b4f;--sun:#ffcf3f;--pink:#ff6fa8;--green:#2fbf71}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2));color:var(--ink);
  font-family:"Baloo 2","Nunito",system-ui,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;height:80px;flex:none}
.spacer{flex:1}
.round{width:56px;height:56px;border-radius:50%;background:#fff;font-size:28px;box-shadow:0 4px 0 rgba(0,0,0,.12);display:grid;place-items:center;position:relative;flex:none}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.pill{height:56px;padding:0 18px;border-radius:28px;background:#fff;font-size:24px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.title{font-size:34px;font-weight:800;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.15);letter-spacing:1px}
.homeBody{flex:1;overflow-y:auto;padding:4px 14px 30px}
.heroRow{display:flex;gap:16px;justify-content:center;margin:6px 0 14px}
.bigBtn{width:130px;height:130px;border-radius:36px;font-size:64px;box-shadow:0 8px 0 rgba(0,0,0,.15);display:grid;place-items:center}
.bigBtn:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.15)}
#btnPlay{background:var(--sun);animation:breathe 2.2s ease-in-out infinite}
#btnGames{background:var(--pink)}
#btnGames.locked{filter:grayscale(.8);opacity:.6}
.group{background:rgba(255,255,255,.55);border-radius:28px;padding:14px;margin:0 auto 14px;max-width:960px}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.tile{width:84px;height:96px;border-radius:24px;background:#fff;font-size:50px;font-weight:800;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.12);position:relative}
.tile .st{font-size:15px;letter-spacing:1px;color:#ffb300;margin-top:4px}
.tile.locked{background:#e8eef7;color:#a9b7cc}
.tile.locked::after{content:"🔒";position:absolute;font-size:26px;top:28px}
.tile.next{animation:bounce 1.2s ease-in-out infinite;outline:4px solid var(--sun)}
.stages{display:flex;gap:8px}
.sd{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.5);display:grid;place-items:center;font-size:22px;transition:.3s;flex:none;position:relative}
.sd i{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-style:normal;font-size:12px;letter-spacing:-1px;color:#ffb300;text-shadow:0 1px 0 #fff;white-space:nowrap}
.sd.on{background:#fff;transform:scale(1.15);box-shadow:0 0 0 4px var(--sun)}
.sd.done{background:var(--green)}
.brushes{display:flex;gap:6px}
.br{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.6);font-size:24px;display:grid;place-items:center;flex:none}
.br.sel{background:#fff;box-shadow:0 0 0 4px var(--pink)}
.br.locked{opacity:.35}
.boardWrap{flex:1;display:grid;place-items:center;position:relative}
#board{position:relative;background:rgba(255,255,255,.35);border-radius:36px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.6)}
#board canvas{position:absolute;inset:0;width:100%;height:100%}
#board,#board canvas,#gameArea{touch-action:none}
#board.boing{animation:boing .9s cubic-bezier(.3,1.6,.5,1)}
#board.fly{animation:fly 1.3s ease-in-out}
#board.spin{animation:spin2 1.1s cubic-bezier(.5,0,.3,1)}
#bigEm{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(120px,40vmin,320px);pointer-events:none;opacity:0}
#bigEm.on{animation:grow 1.8s cubic-bezier(.3,1.5,.5,1) forwards}
#card{position:absolute;inset:0;border-radius:36px;background:rgba(255,255,255,.86);display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:5;padding:16px;text-align:center}
#card.on{display:flex}
#card>*{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.cIcon{font-size:clamp(70px,16vmin,130px);line-height:1}
.cTitle{font-size:clamp(28px,6vmin,48px);font-weight:800;line-height:1.1}
.cTitle b{color:var(--pink);font-size:1.4em}
.cStars{font-size:clamp(44px,10vmin,72px);letter-spacing:6px;min-height:1em;line-height:1.1}
.cStars span{display:inline-block;transform:scale(0);animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}
.cStars .off{filter:grayscale(1);opacity:.3}
.cBtns{display:flex;gap:14px;align-items:center;margin-top:8px;flex-wrap:wrap;justify-content:center}
.goBtn{height:92px;padding:0 34px;border-radius:30px;background:var(--green);color:#fff;font-size:clamp(26px,5vmin,36px);font-weight:800;box-shadow:0 8px 0 #1f8a51;animation:breathe 2s ease-in-out infinite}
.goBtn:active{transform:translateY(5px);box-shadow:0 3px 0 #1f8a51}
.againBtn{height:72px;padding:0 22px;border-radius:24px;background:#e8f2ff;font-size:22px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.12)}
#gameArea{flex:1;position:relative;overflow:hidden}
.prog{display:flex;gap:6px}
.prog i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.5);display:block}
.prog i.ok{background:var(--sun);box-shadow:0 0 0 3px #fff}
.bubble{position:absolute;left:0;top:0;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9) 0 10%,rgba(255,255,255,.25) 11% 30%,var(--c) 62%);
  box-shadow:inset 0 -6px 12px rgba(0,0,0,.15),0 6px 14px rgba(0,0,0,.12);text-shadow:0 3px 0 rgba(0,0,0,.2);will-change:transform}
.bubble.wob{animation:wob .45s}
.findWrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
.findEmoji{font-size:clamp(90px,22vh,180px);line-height:1;animation:float 2.5s ease-in-out infinite}
.findWord{font-size:clamp(40px,8vh,64px);font-weight:800;background:#fff;border-radius:24px;padding:0 24px}
.findWord b{color:var(--pink)}
.cards{display:flex;gap:18px;margin-top:10px}
.card{width:clamp(100px,22vw,150px);height:clamp(110px,24vw,160px);border-radius:30px;background:#fff;font-size:clamp(64px,14vw,100px);font-weight:800;box-shadow:0 8px 0 rgba(0,0,0,.14)}
.card.good{background:var(--green);color:#fff;animation:bounce .6s}
.card.bad{animation:shake .45s}
.overlay{position:fixed;inset:0;background:rgba(20,40,90,.45);display:none;place-items:center;z-index:20;padding:16px}
.overlay.on{display:grid}
.panel{background:#fff;border-radius:36px;padding:20px 24px;max-width:640px;width:100%;max-height:92vh;overflow-y:auto;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.15);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.winEmoji{font-size:100px;line-height:1.1}
.winWord{font-size:48px;font-weight:800}
.winWord b{color:var(--pink);font-size:62px}
.stars{font-size:60px;letter-spacing:6px;min-height:76px}
.stars span{display:inline-block;transform:scale(0);animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}
.stars .off{filter:grayscale(1);opacity:.3}
.recap{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:2px 0 6px}
.recap span{background:#f2f6fc;border-radius:16px;padding:2px 10px;font-size:22px;white-space:nowrap}
.recap small{color:#ffb300;font-size:18px}
.gain{font-size:22px;font-weight:800;color:#6b7a99;min-height:60px}
.gain .stk{font-size:50px;display:inline-block;animation:spin 1s}
.row{display:flex;gap:16px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.row .bigBtn{width:96px;height:96px;font-size:46px;border-radius:28px;background:var(--sun)}
.row .bigBtn.alt{background:#e8f2ff}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;margin:14px 0}
.album div{height:80px;border-radius:20px;background:#f2f6fc;font-size:48px;display:grid;place-items:center;position:relative}
.album div.no{filter:grayscale(1);opacity:.25}
.album div b{position:absolute;right:6px;bottom:2px;font-size:16px;background:var(--pink);color:#fff;border-radius:10px;padding:0 6px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:2px solid #eef2f8;text-align:left;flex-wrap:wrap}
.prow label{font-size:20px;font-weight:800}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:44px;padding:0 14px;border-radius:22px;background:#eef2f8;font-size:17px;font-weight:800}
.seg button.on{background:var(--sky1);color:#fff}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini span{width:54px;border-radius:12px;background:#f2f6fc;font-weight:800;font-size:22px;line-height:1.1;padding:2px 0;text-align:center}
.mini small{display:block;font-size:11px;color:#ffb300}
.danger{background:#ffe1e1!important;color:#c62828}
.backup{width:100%;min-height:90px;margin-top:8px;border:2px solid #dbe5f3;border-radius:14px;padding:8px;font:13px/1.4 monospace;resize:vertical;user-select:text;-webkit-user-select:text}
.bmsg{font-size:16px;font-weight:600;min-height:22px;margin-top:4px}
.ring{position:absolute;inset:-4px;border-radius:50%;border:5px solid var(--pink);clip-path:inset(0 0 100% 0);opacity:0}
.round.hold .ring{opacity:1;animation:hold 1.5s linear forwards}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) scale(0);background:#fff;border-radius:30px;padding:10px 26px;font-size:28px;font-weight:800;z-index:30;box-shadow:0 6px 0 rgba(0,0,0,.15);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
#toast.on{transform:translateX(-50%) scale(1)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.menuGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:780px;margin:8px auto 20px;padding:0 4px}
.mcard{border-radius:36px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 8px 0 rgba(0,0,0,.15);color:#fff;min-height:clamp(150px,30vh,230px)}
.mcard:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.mcard .mi{font-size:clamp(54px,10vw,88px);font-weight:800;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.15)}
.mcard .ml{font-size:clamp(18px,3vw,24px);font-weight:800}
.mcard .bar{width:70%;height:10px;border-radius:5px;background:rgba(255,255,255,.35);overflow:hidden}
.mcard .bar i{display:block;height:100%;background:#fff;border-radius:5px}
.mcard.light{background:#fff;color:var(--ink)}.mcard.light .bar{background:#e8eef7}.mcard.light .bar i{background:var(--green)}
.mcard.locked{filter:grayscale(.9);opacity:.55}
.ptitle{font-size:28px;font-weight:800;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.15)}
.bigGlyph{font-size:clamp(110px,24vh,210px);font-weight:800;line-height:1.05;color:var(--pink);background:#fff;border-radius:36px;padding:0 44px;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.countBox{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center;max-width:min(92vw,640px);font-size:clamp(44px,8.5vh,74px);line-height:1.15;background:rgba(255,255,255,.65);border-radius:30px;padding:12px 18px}
.countBox span{display:inline-block;transition:transform .2s}
.countBox span.hit{transform:scale(1.4)}
.objs{font-size:.62em;letter-spacing:-2px}
body.talking .vgate{pointer-events:none;opacity:.4;filter:grayscale(.7);animation:none!important}
#model{position:absolute;left:2%;top:2%;z-index:3;display:none;align-items:center;gap:4px;background:#fff;border-radius:22px;padding:2px 14px 2px 12px;box-shadow:0 5px 0 rgba(0,0,0,.12);font-size:clamp(30px,6vmin,52px);font-weight:800;color:var(--pink);line-height:1.15}
#model.on{display:flex;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
#model span{font-size:.75em}
.cChoices{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.cChoices:empty{display:none}
.qbtn{width:clamp(90px,18vmin,140px);height:clamp(100px,20vmin,150px);border-radius:28px;background:#fff;font-size:clamp(56px,12vmin,96px);font-weight:800;box-shadow:0 8px 0 rgba(0,0,0,.14);border:3px solid #e3ecf8}
.qbtn.good{background:var(--green);color:#fff;border-color:var(--green);animation:bounce .6s}
.qbtn.bad{animation:shake .45s}
.cBig{font-size:clamp(110px,26vmin,220px);font-weight:800;color:var(--pink);line-height:1}
.cBig.ok{color:var(--green)}
.mic{background:#ff5a5f;box-shadow:0 8px 0 #c43c40;font-size:44px;width:110px;padding:0}
.mic.listening{animation:micPulse 1s ease-in-out infinite}
@keyframes micPulse{50%{transform:scale(1.12);box-shadow:0 0 0 14px rgba(255,90,95,.25),0 8px 0 #c43c40}}
.gateQ{font-size:40px;font-weight:800;margin:6px 0}
.gateAns{font-size:44px;font-weight:800;min-height:60px;background:#f2f6fc;border-radius:18px;margin:6px auto;max-width:200px}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center;margin-top:8px}
.keypad button{height:62px;border-radius:18px;background:#eef2f8;font-size:28px;font-weight:800}
.keypad button.ok{background:var(--green);color:#fff}
@keyframes breathe{50%{transform:scale(1.06)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.12) rotate(-3deg)}55%{transform:scale(.94) rotate(2deg)}100%{transform:scale(1)}}
@keyframes fly{0%{transform:none}40%{transform:translateY(-16%) rotate(-7deg) scale(1.05)}70%{transform:translateY(4%) rotate(3deg)}100%{transform:none}}
@keyframes spin2{0%{transform:none}50%{transform:rotate(180deg) scale(.8)}100%{transform:rotate(360deg)}}
@keyframes grow{0%{opacity:0;transform:scale(0) rotate(-30deg)}35%{opacity:1;transform:scale(1.25) rotate(8deg)}55%{transform:scale(1) rotate(0)}85%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes wob{25%{transform:var(--t) rotate(-12deg) scale(.92)}75%{transform:var(--t) rotate(12deg) scale(.92)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes float{50%{transform:translateY(-12px)}}
@keyframes spin{0%{transform:scale(0) rotate(-200deg)}100%{transform:scale(1) rotate(0)}}
@keyframes hold{to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){#btnPlay,.tile.next,.findEmoji,.goBtn{animation:none}}
@media (max-width:700px){.title{font-size:26px}.br{width:40px;height:40px;font-size:20px}.sd{width:36px;height:36px;font-size:17px}.round{width:48px;height:48px;font-size:24px}.topbar{gap:5px;padding:8px}}
</style>
</head>
<body>

<section id="menu" class="screen on">
  <div class="topbar">
    <div class="title">ABC ✏️</div>
    <div class="spacer"></div>
    <button id="btnAlbum" class="round" aria-label="Album">🏆</button>
    <button id="btnLang" class="pill" aria-label="Langue"></button>
    <button id="btnGear" class="round" aria-label="Parent">⚙️</button>
  </div>
  <div class="homeBody"><div class="menuGrid" id="menuGrid"></div></div>
</section>

<section id="games" class="screen">
  <div class="topbar">
    <button id="gamesHome" class="round" aria-label="Home">🏠</button>
    <div class="ptitle" id="gamesTitle"></div>
    <div class="spacer"></div>
  </div>
  <div class="homeBody"><div class="menuGrid" id="gamesGrid"></div></div>
</section>

<section id="home" class="screen">
  <div class="topbar">
    <button id="pathHome" class="round" aria-label="Home">🏠</button>
    <div class="ptitle" id="pathTitle"></div>
    <div class="spacer"></div>
  </div>
  <div class="homeBody">
    <div class="heroRow">
      <button id="btnPlay" class="bigBtn" aria-label="Play">▶️</button>
      <button id="btnGames" class="bigBtn" aria-label="Games">🎈</button>
    </div>
    <div class="group"><div class="tiles" id="tiles"></div></div>
  </div>
</section>

<section id="play" class="screen">
  <div class="topbar">
    <button id="playHome" class="round" aria-label="Home">🏠</button>
    <div class="stages" id="stages"></div>
    <div class="spacer"></div>
    <div class="brushes" id="brushes"></div>
    <button id="playSay" class="round" aria-label="Say">🔊</button>
  </div>
  <div class="boardWrap" id="boardWrap">
    <div id="board">
      <canvas id="cBase"></canvas>
      <canvas id="cInk"></canvas>
      <canvas id="cTop"></canvas>
      <div id="bigEm"></div>
      <button id="model" aria-label="Model"></button>
      <div id="card">
        <div class="cIcon" id="cIcon"></div>
        <div class="cTitle" id="cTitle"></div>
        <div class="cStars" id="cStars"></div>
        <div class="cChoices" id="cChoices"></div>
        <div class="cBtns">
          <button id="cSay" class="round" aria-label="Say">🔊</button>
          <button id="cAgain" class="againBtn vgate"></button>
          <button id="cGo" class="goBtn vgate"></button>
          <button id="cMic" class="goBtn mic vgate" aria-label="Micro">🎤</button>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="game" class="screen">
  <div class="topbar">
    <button id="gameHome" class="round" aria-label="Home">🏠</button>
    <div class="prog" id="prog"></div>
    <div class="spacer"></div>
    <button id="gameSay" class="round" aria-label="Say">🔊</button>
  </div>
  <div id="gameArea"></div>
</section>

<div id="win" class="overlay"><div class="panel">
  <div class="winEmoji" id="winEmoji"></div>
  <div class="winWord" id="winWord"></div>
  <div class="stars" id="winStars"></div>
  <div class="recap" id="winRecap"></div>
  <div class="gain" id="winGain"></div>
  <div class="row">
    <button id="winHome" class="bigBtn alt">🏠</button>
    <button id="winAgain" class="bigBtn alt vgate">🔁</button>
    <button id="winNext" class="bigBtn vgate">➡️</button>
  </div>
</div></div>

<div id="albumOv" class="overlay"><div class="panel">
  <div class="winWord">🏆</div>
  <div class="album" id="albumGrid"></div>
  <div class="row"><button id="albumClose" class="bigBtn">✖️</button></div>
</div></div>

<div id="parentOv" class="overlay"><div class="panel" id="parentPanel"></div></div>
<div id="gateOv" class="overlay"><div class="panel" style="max-width:420px">
  <div style="font-size:18px;font-weight:600;color:#6b7a99" id="gateHint"></div>
  <div class="gateQ" id="gateQ"></div>
  <div class="gateAns" id="gateAns"></div>
  <div class="keypad" id="keypad"></div>
  <div class="row"><button class="pill" id="gateClose">✖️</button></div>
</div></div>
<div id="toast"></div>
<canvas id="fx"></canvas>

<script>
{
/* ================= data ================= */
const ORDER='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const ln=(x1,y1,x2,y2)=>({t:'L',x1,y1,x2,y2});
const arc=(cx,cy,rx,ry,a0,a1)=>({t:'A',cx,cy,rx,ry,a0,a1});
const poly=(...p)=>{const s=[];for(let i=0;i+3<p.length;i+=2)s.push(ln(p[i],p[i+1],p[i+2],p[i+3]));return s;};

function bus(){const a=ac();if(!a)return null;

 return BUS;}

 g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(B.sfx);o.start(t0);o.stop(t0+d+.02);}

const AUD={};let voiceSrcs=[];
async function loadAudio(lang){
 if(AUD[lang])return AUD[lang].p;
 const rec={ok:false};AUD[lang]=rec;
 rec.p=(async()=>{try{
  const [map,bin]=await Promise.all([fetch(`audio/${lang}.json`).then(r=>{if(!r.ok)throw 0;return r.json();}),fetch(`audio/${lang}.mp3`).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();})]);
  const a=ac();if(!a)throw 0;
  rec.buf=await new Promise((res,rej)=>{const pr=a.decodeAudioData(bin,res,rej);if(pr&&pr.catch)pr.catch(rej);});rec.map=map;rec.ok=true;
 }catch(e){rec.ok=false;}})();
 return rec.p;
}

let VOICE_END=0;const talking=()=>performance.now()<VOICE_END;
function afterVoice(fn,extra=0){setTimeout(fn,Math.max(0,VOICE_END-performance.now())+extra);}
function stopVoice(){voiceSrcs.forEach(s=>{try{s.stop();}catch(e){}});voiceSrcs=[];VOICE_END=0;try{speechSynthesis.cancel();}catch(e){}}
function say(keys){
 if(!Array.isArray(keys))keys=[keys];stopVoice();
 const A=AUD[S.lang],a=ac();
 if(A&&A.ok&&a){let t0=a.currentTime+.05;
  const offs=[],base=t0;
  const B=bus();if(B)B.vox.gain.value=VOX_LEVEL[S.lang]||1;
  for(const k of keys){const sg=A.map[k];if(!sg){offs.push(t0-base);continue;}const src=a.createBufferSource();src.buffer=A.buf;src.connect(B?B.vox:a.destination);
   src.start(t0,Math.max(0,sg[0]-.02),sg[1]+.1);voiceSrcs.push(src);offs.push(t0-base);t0+=sg[1]+.3;}
  offs.push(t0-base);VOICE_END=performance.now()+(t0-base-.25)*1000;return offs;}
 if(!('speechSynthesis' in window))return;
 const text=keys.map(textOf).join(' ');
 VOICE_END=performance.now()+keys.length*1600;
 setTimeout(()=>{try{const u=new SpeechSynthesisUtterance(text);u.lang=S.lang==='fr'?'fr-FR':'en-US';u.rate=.9;u.onend=()=>{VOICE_END=performance.now();};speechSynthesis.speak(u);}catch(e){VOICE_END=0;}},60);

}

function part(o){if(FX.length>900)return;FX.push(Object.assign({x:0,y:0,vx:0,vy:0,g:0,life:1,max:1,size:6,color:rnd(COLORS),type:'dot',rot:0,vr:0},o));}
function burst(x,y,n=18,sp=260,type='dot'){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=sp*(.4+Math.random()*.8);part({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:300,life:.7+Math.random()*.5,size:4+Math.random()*6,type,vr:(Math.random()-.5)*10});}part({x,y,type:'ring',life:.5,size:10,color:'#fff'});}
function confetti(n=140){for(let i=0;i<n;i++)part({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.4,vx:(Math.random()-.5)*120,vy:150+Math.random()*200,g:60,life:3+Math.random()*1.5,size:8+Math.random()*8,type:'confetti',vr:(Math.random()-.5)*12});}
function fireworks(n=6){for(let i=0;i<n;i++)setTimeout(()=>{part({x:innerWidth*(.15+Math.random()*.7),y:innerHeight+10,vy:-(innerHeight*1.1+Math.random()*200),g:innerHeight*.9,life:.9,size:5,type:'rocket',color:'#fff'});},i*280);}
function starRain(n=45){for(let i=0;i<n;i++)part({x:Math.random()*innerWidth,y:-30-Math.random()*300,vy:220+Math.random()*180,vx:(Math.random()-.5)*60,life:3,size:14+Math.random()*12,type:'star',vr:(Math.random()-.5)*4});}
function balloons(n=16){for(let i=0;i<n;i++)part({x:Math.random()*innerWidth,y:innerHeight+40+Math.random()*200,vy:-(160+Math.random()*120),vx:(Math.random()-.5)*40,g:-10,life:4.5,size:40+Math.random()*24,type:'emoji',ch:rnd(['🎈','🎈','🎈','🎉','⭐']),vr:(Math.random()-.5)*.6});}
function starPath(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}c.closePath();}
function updateFx(dt){
 fctx.setTransform(DPR,0,0,DPR,0,0);fctx.clearRect(0,0,innerWidth,innerHeight);
 const born=[];
 FX=FX.filter(p=>{p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
  if(p.life<=0){if(p.type==='rocket'){SFX.boom();const col=rnd(COLORS);for(let i=0;i<40;i++){const a=Math.random()*Math.PI*2,s=120+Math.random()*220;born.push({x:p.x,y:p.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:160,life:1+Math.random()*.6,max:1.6,size:3+Math.random()*3,color:col,type:'dot'});}}return false;}
  const a=clamp(p.life/(p.max||1),0,1);fctx.globalAlpha=(p.type==='confetti'||p.type==='star'||p.type==='emoji')?1:a;fctx.fillStyle=p.color;
  if(p.type==='dot'||p.type==='rocket'){fctx.beginPath();fctx.arc(p.x,p.y,Math.max(.5,p.size),0,7);fctx.fill();}
  else if(p.type==='confetti'){fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.rot);fctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);fctx.restore();}
  else if(p.type==='star'||p.type==='sparkle'){fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.rot);starPath(fctx,0,0,p.size);fctx.fill();fctx.restore();}
  else if(p.type==='ring'){fctx.strokeStyle=p.color;fctx.lineWidth=4;fctx.beginPath();fctx.arc(p.x,p.y,Math.max(1,p.size+(.5-p.life)*220),0,7);fctx.stroke();}
  else if(p.type==='smoke'){fctx.globalAlpha=a*.5;fctx.beginPath();fctx.arc(p.x,p.y,Math.max(.5,p.size*(1.6-a)),0,7);fctx.fill();}
  else if(p.type==='emoji'){fctx.save();fctx.translate(p.x,p.y);fctx.rotate(Math.sin(p.rot)*.2);fctx.font=`${p.size}px sans-serif`;fctx.textAlign='center';fctx.textBaseline='middle';fctx.fillText(p.ch,0,0);fctx.restore();}
  return true;});
 born.forEach(b=>part(b));fctx.globalAlpha=1;
}

/* ================= board geometry ================= */
const board=$('board'),cBase=$('cBase'),cInk=$('cInk'),cTop=$('cTop'),bctx=cBase.getContext('2d'),ictx=cInk.getContext('2d'),tctx=cTop.getContext('2d');
let BS=400,SC=4,OFF=8,RECT=null;
function layoutBoard(){
 const wrap=$('boardWrap').getBoundingClientRect();
 BS=Math.floor(Math.max(200,Math.min(wrap.width-24,wrap.height-24)));
 board.style.width=BS+'px';board.style.height=BS+'px';
 [cBase,cInk,cTop].forEach(c=>{c.width=BS*DPR;c.height=BS*DPR;});
 SC=BS/104;OFF=BS*.02;RECT=board.getBoundingClientRect();
 redrawInk();
}
const toScreen=(x,y)=>{const r=RECT||board.getBoundingClientRect();return [r.left+OFF+x*SC,r.top+OFF+y*SC];};
const toLetter=(cx,cy)=>{const r=RECT||board.getBoundingClientRect();return [(cx-r.left-OFF)/SC,(cy-r.top-OFF)/SC];};
const STEP=1.2;
function sampleStroke(segs){const pts=[];
 for(const s of segs){const seg=[];
  if(s.t==='L'){const n=Math.max(1,Math.ceil(Math.hypot(s.x2-s.x1,s.y2-s.y1)/STEP));for(let i=0;i<=n;i++)seg.push([s.x1+(s.x2-s.x1)*i/n,s.y1+(s.y2-s.y1)*i/n]);}
  else{const a0=s.a0*Math.PI/180,a1=s.a1*Math.PI/180,n=Math.max(2,Math.ceil(Math.abs(a1-a0)*(s.rx+s.ry)/2/STEP));for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;seg.push([s.cx+s.rx*Math.cos(a),s.cy+s.ry*Math.sin(a)]);}}
  if(pts.length)seg.shift();pts.push(...seg);}
 return pts;}
function tol(){const base={easy:13,med:10,hard:7.5}[S.diff]||13;const f=S.adaptive?clamp(1.15-learned().length*.012,.85,1.15):1;return base*f*(P&&P.stage===3?1.1:1)*(P&&P.mod==='lower'?.8:1);}
function setLetterTf(c){c.setTransform(DPR,0,0,DPR,0,0);c.translate(OFF,OFF);c.scale(SC,SC);c.lineCap='round';c.lineJoin='round';}
function demoDur(pts){const len=(pts.length-1)*STEP,sp=S.speed==='normal'?55:28;return clamp(len/sp*1000,1300,9000);}

/* ================= ink: brushes and hero trails ================= */
let inkLog=[];
function clearInk(){inkLog=[];ictx.setTransform(1,0,0,1,0,0);ictx.clearRect(0,0,cInk.width,cInk.height);}
function redrawInk(){ictx.setTransform(1,0,0,1,0,0);ictx.clearRect(0,0,cInk.width,cInk.height);if(!P)return;
 for(const l of inkLog){
  if(l.free){paintPath(l.pts,1,l.pts.length-1,l.b,l.hue,false);continue;}
  const pts=P.strokes[l.si];if(!pts)continue;paintPath(pts,l.from,Math.min(l.to,pts.length-1),l.b,l.hue,false);}
}
function paintPath(pts,from,to,b,hue,live){
 if(!pts||to<1)return;setLetterTf(ictx);
 for(let i=Math.max(1,from);i<=to&&i<pts.length;i++)paintSeg(ictx,pts[i-1],pts[i],i,b,hue,live);
 ictx.shadowBlur=0;ictx.lineCap='round';
}
function drawInk(si,from,to,live,b,record=true){
 if(!P||to<=from)return;const pts=P.strokes[si];if(!pts)return;const hue=P.hue+si*50;
 if(record){const last=inkLog[inkLog.length-1];if(last&&!last.free&&last.si===si&&last.b===b&&last.to===from)last.to=to;else inkLog.push({si,from,to,b,hue});}
 paintPath(pts,from,to,b,hue,live);
}
function paintSeg(c,a,p,i,b,hue,live){
 const W=9,h=(hue+i*3)%360;
 const line=(w,col,cap='round')=>{c.lineCap=cap;c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(p[0],p[1]);c.stroke();};
 const dx=p[0]-a[0],dy=p[1]-a[1],L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
 const ext=(w,col,off=0)=>{c.lineCap='butt';c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(a[0]-ux*.4+nx*off,a[1]-uy*.4+ny*off);c.lineTo(p[0]+ux*.4+nx*off,p[1]+uy*.4+ny*off);c.stroke();};
 const spark=(cols)=>{if(!live)return;const [x,y]=toScreen(p[0],p[1]);part({x,y,vx:(Math.random()-.5)*60,vy:-40-Math.random()*60,life:.6,max:.6,size:4+Math.random()*3,type:'sparkle',color:rnd(cols)});};
 switch(b){
  case 'rainbow':line(W,`hsl(${h},90%,55%)`);break;
  case 'glitter':line(W,i%2?'#ffc107':'#ffd54f');if(i%2===0){c.fillStyle='#fff';c.beginPath();c.arc(p[0]+(Math.random()-.5)*6,p[1]+(Math.random()-.5)*6,.7,0,7);c.fill();}if(i%3===0)spark(['#fff','#ffe082','#ffd54f']);break;
  case 'stars':line(W*.55,`hsl(${h},90%,82%)`);if(i%4===0){c.fillStyle=`hsl(${(h*7)%360},90%,58%)`;c.strokeStyle='#fff';c.lineWidth=.8;starPath(c,p[0],p[1],5.2);c.fill();c.stroke();}break;
  case 'bubbles':if(i%3===0){c.fillStyle=`hsla(${h},85%,65%,.8)`;c.beginPath();c.arc(p[0],p[1],4.4,0,7);c.fill();c.fillStyle='rgba(255,255,255,.85)';c.beginPath();c.arc(p[0]-1.4,p[1]-1.4,1.1,0,7);c.fill();}break;
  case 'neon':{const col=(Math.floor(hue/50)%2)?'#ff4fd8':'#00e5ff';c.shadowColor=col;c.shadowBlur=14;line(W*.8,col);c.shadowBlur=0;line(W*.28,'#fff');break;}
  case 'road':ext(10,'#5d6470');ext(1,'rgba(255,255,255,.35)',4.6);ext(1,'rgba(255,255,255,.35)',-4.6);if(i%6<3)ext(1.3,'#fff');break;
  case 'rails':if(i%3===0){c.lineCap='butt';c.strokeStyle='#a1887f';c.lineWidth=1.4;c.beginPath();c.moveTo(p[0]+nx*4,p[1]+ny*4);c.lineTo(p[0]-nx*4,p[1]-ny*4);c.stroke();}
   ext(1,'#6d4c41',2.6);ext(1,'#6d4c41',-2.6);break;
  case 'flowers':line(2,'#66bb6a');if(i%8===0){const pc=`hsl(${(hue+i*37)%360},85%,65%)`;c.fillStyle=pc;for(let k=0;k<5;k++){const an=k*Math.PI*2/5+i;c.beginPath();c.arc(p[0]+Math.cos(an)*2,p[1]+Math.sin(an)*2,1.5,0,7);c.fill();}c.fillStyle='#ffd54f';c.beginPath();c.arc(p[0],p[1],1.2,0,7);c.fill();}
   else if(i%8===4){c.fillStyle='#43a047';c.beginPath();c.ellipse(p[0]+nx*2.2,p[1]+ny*2.2,1.9,.9,Math.atan2(ny,nx),0,7);c.fill();}break;
  case 'scales':line(7,'#81c784');if(i%3===0){c.fillStyle=i%6?'#388e3c':'#c5e1a5';c.beginPath();c.moveTo(p[0]+ux*1.6,p[1]+uy*1.6);c.lineTo(p[0]+nx*1.6,p[1]+ny*1.6);c.lineTo(p[0]-ux*1.6,p[1]-uy*1.6);c.lineTo(p[0]-nx*1.6,p[1]-ny*1.6);c.fill();}break;
  case 'flame':line(7,`hsl(${15+(i%12)*3},100%,55%)`);line(2.4,'#fff59d');if(i%2===0)spark(['#ffeb3b','#ff9800','#ff5722']);break;
  case 'honey':if(i%3===0){c.fillStyle='#ffb300';c.beginPath();c.arc(p[0],p[1],2.4,0,7);c.fill();c.fillStyle='rgba(255,255,255,.7)';c.beginPath();c.arc(p[0]-.7,p[1]-.7,.7,0,7);c.fill();}break;

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function circ(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill();}
function poseAt(pts,k,back){const i=clamp(Math.round(k-back/STEP),0,pts.length-1);const a=pts[Math.max(0,i-2)],b=pts[Math.min(pts.length-1,i+2)];return {x:pts[i][0],y:pts[i][1],ang:Math.atan2(b[1]-a[1],b[0]-a[0])};}
function inFrame(c,ps,flip,fn){c.save();c.translate(ps.x,ps.y);c.rotate(ps.ang);if(flip&&Math.cos(ps.ang)<-.05)c.scale(1,-1);fn();c.restore();}
function shadow(c,w){c.fillStyle='rgba(0,0,0,.13)';c.beginPath();c.ellipse(0,4.4,w,1.2,0,0,7);c.fill();}
function wheel(c,x,y,r,spin){circ(c,x,y,r,'#263238');circ(c,x,y,r*.45,'#cfd8dc');c.strokeStyle='#90a4ae';c.lineWidth=.4;c.beginPath();c.moveTo(x+Math.cos(spin)*r*.8,y+Math.sin(spin)*r*.8);c.lineTo(x-Math.cos(spin)*r*.8,y-Math.sin(spin)*r*.8);c.stroke();}
function drawHero(c,P,pts,k,now,mv){
 const type=P.hero,col=P.heroCol,bob=mv?Math.sin(now/55)*.3:0,spin=k*.5;
 if(type==='car'){inFrame(c,poseAt(pts,k,0),true,()=>{shadow(c,6.5);c.translate(0,bob);
  c.fillStyle=col;rr(c,-6.5,-2.6,13,4.8,1.8);c.fill();c.fillStyle='rgba(255,255,255,.35)';rr(c,-5.5,-2.2,11,1.2,.6);c.fill();
  c.fillStyle=col;rr(c,-3.6,-6,7.2,3.8,1.6);c.fill();c.fillStyle='#d6f1ff';rr(c,-2.9,-5.3,2.6,2.5,.6);c.fill();rr(c,.3,-5.3,2.6,2.5,.6);c.fill();
  circ(c,6.1,-.8,.9,'#fff59d');circ(c,-6.2,-.6,.6,'#ff5252');wheel(c,-4,2.4,2,spin);wheel(c,4,2.4,2,spin);});}
 else if(type==='train'){
  const parts=[{b:19,w:1},{b:9.5,w:2},{b:0,w:0}];
  for(let j=0;j<parts.length-1;j++){const a=poseAt(pts,k,parts[j].b),b2=poseAt(pts,k,parts[j+1].b);c.strokeStyle='#455a64';c.lineWidth=.8;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b2.x,b2.y);c.stroke();}
  parts.forEach(pt=>inFrame(c,poseAt(pts,k,pt.b),true,()=>{shadow(c,4.8);c.translate(0,bob*.6);
   if(pt.w){c.fillStyle=pt.w===1?'#29b6f6':'#ffca28';rr(c,-4.4,-4,8.8,5.4,1);c.fill();c.fillStyle='#fff';rr(c,-3.4,-3.2,2.6,2,.4);c.fill();rr(c,.8,-3.2,2.6,2,.4);c.fill();wheel(c,-2.6,1.9,1.5,spin);wheel(c,2.6,1.9,1.5,spin);}
   else{c.fillStyle='#e53935';rr(c,-5,-3,10,4.6,1);c.fill();c.fillStyle='#b71c1c';rr(c,-5,-7,4.4,4.4,.6);c.fill();c.fillStyle='#d6f1ff';rr(c,-4.2,-6.2,2.8,2,.4);c.fill();

    wheel(c,-3,1.9,1.7,spin);wheel(c,.5,1.9,1.4,spin);wheel(c,3.4,1.9,1.4,spin);}}));

 else if(type==='caterpillar'){
  for(let j=6;j>=0;j--){const ps=poseAt(pts,k,j*2.6),nx=-Math.sin(ps.ang),ny=Math.cos(ps.ang),lift=mv?Math.abs(Math.sin(now/110+j*.9))*1:0;

    circ(c,1.6,-1,1.1,'#fff');circ(c,1.9,-1,.55,'#222');c.strokeStyle='#33691e';c.lineWidth=.5;c.beginPath();c.arc(1.5,.8,1.3,.2,1.6);c.stroke();circ(c,2.6,.6,.5,'rgba(255,111,168,.6)');});}
   else{circ(c,x,y,3.1,j%2?'#7cb342':'#8bc34a');circ(c,x-.8,y-.9,.9,'rgba(255,255,255,.35)');}}}
 else if(type==='snake'){
  const N=26;let prev=null;
  for(let j=N;j>=0;j--){const back=j*1.4,ps=poseAt(pts,k,back),nx=-Math.sin(ps.ang),ny=Math.cos(ps.ang),amp=1.3*Math.min(1,back/5),w=Math.sin(back*.45-now/130)*amp;
   const pnt=[ps.x+nx*w,ps.y+ny*w];if(prev){c.strokeStyle=Math.floor(j/3)%2?'#43a047':'#66bb6a';c.lineWidth=1.4+(1-j/N)*4.2;c.lineCap='round';c.beginPath();c.moveTo(prev[0],prev[1]);c.lineTo(pnt[0],pnt[1]);c.stroke();}prev=pnt;}
  inFrame(c,poseAt(pts,k,0),false,()=>{if(Math.sin(now/170)>.2){c.strokeStyle='#e53935';c.lineWidth=.5;c.beginPath();c.moveTo(3,0);c.lineTo(5.4,0);c.lineTo(6.2,-.8);c.moveTo(5.4,0);c.lineTo(6.2,.8);c.stroke();}
   c.fillStyle='#2e7d32';c.beginPath();c.ellipse(0,0,3.4,2.6,0,0,7);c.fill();circ(c,1.2,-1.3,.8,'#fff');circ(c,1.2,1.3,.8,'#fff');circ(c,1.5,-1.3,.4,'#111');circ(c,1.5,1.3,.4,'#111');});}
 else if(type==='rocket'){inFrame(c,poseAt(pts,k,0),true,()=>{
  const fl=4+Math.random()*2.5;c.fillStyle='#ff9800';c.beginPath();c.moveTo(-5,-1.5);c.lineTo(-5-fl,0);c.lineTo(-5,1.5);c.fill();c.fillStyle='#ffeb3b';c.beginPath();c.moveTo(-5,-.8);c.lineTo(-5-fl*.6,0);c.lineTo(-5,.8);c.fill();
  c.fillStyle='#e53935';c.beginPath();c.moveTo(-4,-2.2);c.lineTo(-6.6,-4.4);c.lineTo(-2.2,-2.2);c.fill();c.beginPath();c.moveTo(-4,2.2);c.lineTo(-6.6,4.4);c.lineTo(-2.2,2.2);c.fill();
  c.fillStyle='#f5f5f5';rr(c,-5,-2.5,8.4,5,2.4);c.fill();c.fillStyle='#e53935';c.beginPath();c.moveTo(3,-2.5);c.quadraticCurveTo(7.5,0,3,2.5);c.fill();
  circ(c,.3,0,1.5,'#90a4ae');circ(c,.3,0,1.1,'#4fc3f7');circ(c,0,-.4,.35,'#fff');});
  if(mv&&Math.random()<.5){const ps=poseAt(pts,k,4);const [x,y]=toScreen(ps.x,ps.y);part({x,y,vx:(Math.random()-.5)*50,vy:(Math.random()-.5)*50,life:.5,max:.5,size:3+Math.random()*3,type:'sparkle',color:rnd(['#ffeb3b','#ff9800','#fff'])});}}
 else if(type==='bee'){const ps=poseAt(pts,k,0);ps.y+=Math.sin(now/120)*.8;inFrame(c,ps,true,()=>{
  const fl=.5+Math.abs(Math.sin(now/30))*2.4;c.fillStyle='rgba(255,255,255,.8)';c.strokeStyle='#90caf9';c.lineWidth=.3;
  c.beginPath();c.ellipse(-.6,-3.2,1.8,fl,-.3,0,7);c.fill();c.stroke();c.beginPath();c.ellipse(1,-3,1.5,fl*.85,.3,0,7);c.fill();c.stroke();
  c.fillStyle='#ffd54f';c.beginPath();c.ellipse(0,0,4,2.8,0,0,7);c.fill();c.save();c.clip();c.fillStyle='#3e2723';c.fillRect(-2.2,-3,1.2,6);c.fillRect(.2,-3,1.2,6);c.restore();

function startLetter(L){

 const hero=rndNot(HEROES,lastHero);lastHero=hero;const item=rndNot(ITEMS,lastItem);lastItem=item;
 const mod=modOf(L);CUR=mod;
 P={L,mod,info:itemInfo(L),strokes:MOD[mod].strokes[L].map(sampleStroke),stage:1,phase:'card',si:0,k:0,hue:Math.random()*360,rep:0,anim:null,locked:true,tracing:false,touched:false,

$('playSay').addEventListener('click',()=>{if(!P)return;sayStage();});

 if((P.stage===1||P.stage===2||P.stage===4)&&now-P.lastProg>7000){P.pulseAt=now;P.lastProg=now;if(P.stage===4)P.dirUntil=now+2000;}}

/* ================= games ================= */
let G=null;
function gamePool(type){const m=(GAMES.find(g=>g.id===type)||GAMES[0]).mod;let l=learnedIn(m),all=MOD[m].items;if(m==='num'){l=l.filter(x=>x!=='0');all=all.filter(x=>x!=='0');}
 if(l.length>=3)return l;return S.unlockAll?all.slice():l;}
function modGame(m,any){if(m==='lower')return 'match';if(m==='num')return 'count';return any?'bubbles':rnd(['bubbles','find']);}
function progDots(n,ok){$('prog').innerHTML=Array.from({length:n},(_,i)=>`<i class="${i<ok?'ok':''}"></i>`).join('');}
$('gameSay').addEventListener('click',()=>{if(G&&G.say)G.say();});
function startGame(type,onDone){overlay('win',false);P=null;activePtr=null;stopVoice();show('game');const area=$('gameArea');area.innerHTML='';type=type||'bubbles';
 G=type==='bubbles'?bubbleGame(area):type==='find'?findGame(area):type==='match'?matchGame(area):countGame(area);G.type=type;G.onDone=onDone;}
function gameWin(){const g=G;G=null;const stk=awardSticker();save();SFX.win();vib(120);rnd([()=>confetti(),()=>fireworks(6),()=>starRain(),()=>balloons()])();
 setTimeout(()=>{$('winEmoji').textContent='🏆';$('winWord').textContent=t().say.p0;$('winStars').innerHTML=[0,1,2].map(i=>`<span style="animation-delay:${.2+i*.25}s">⭐</span>`).join('');
  $('winRecap').innerHTML='';$('winGain').innerHTML=`<span class="stk">${stk}</span>`;overlay('win',true);say('gameWin');WIN={mode:'game',type:g.type,onDone:g.onDone};},600);}
function bubbleGame(area){
 const pool=gamePool('bubbles'),target=rnd(pool),need=6;let got=0,bubbles=[],spawnT=0;progDots(need,0);
 let qUntil=0;const sayIt=()=>{say('F_'+target);qUntil=VOICE_END;};setTimeout(sayIt,300);
 function spawn(){const r=area.getBoundingClientRect();const hasT=bubbles.some(b=>b.l===target);const l=(!hasT||Math.random()<.4)?target:rnd(ORDER.filter(x=>x!==target));
  const size=clamp(r.width*.16,80,130),el=document.createElement('div');el.className='bubble';el.textContent=l;el.style.width=el.style.height=size+'px';el.style.fontSize=size*.55+'px';
  el.style.setProperty('--c',`hsl(${Math.random()*360},80%,60%)`);
  const b={el,l,x:Math.random()*Math.max(10,r.width-size),y:r.height+10,sp:60+Math.random()*40,ph:Math.random()*6,size};area.appendChild(el);bubbles.push(b);
  el.addEventListener('pointerdown',()=>tap(b));el.addEventListener('animationend',()=>el.classList.remove('wob'));}
 function tap(b){if(!G||performance.now()<qUntil)return;if(b.l===target){const r2=b.el.getBoundingClientRect();burst(r2.left+r2.width/2,r2.top+r2.height/2,22,300);SFX.pop();SFX.ding();vib(30);b.el.remove();bubbles=bubbles.filter(x=>x!==b);got++;progDots(need,got);if(got>=need){bubbles.forEach(x=>x.el.remove());gameWin();}}
  else{SFX.boop();vib(60);b.el.classList.remove('wob');void b.el.offsetWidth;b.el.classList.add('wob');say('T_'+b.l);}}
 return {say:sayIt,tick(dt){spawnT-=dt;if(spawnT<=0){spawn();spawnT=1.3;}
  bubbles=bubbles.filter(b=>{b.y-=b.sp*dt;b.ph+=dt*2;const x=b.x+Math.sin(b.ph)*14;const tr=`translate(${x}px,${b.y}px)`;b.el.style.setProperty('--t',tr);if(!b.el.classList.contains('wob'))b.el.style.transform=tr;if(b.y<-b.size-10){b.el.remove();return false;}return true;});}};
}
function findGame(area){
 const pool=gamePool('find'),rounds=5;let r=0,target=null,busy=false,lastT=null;progDots(rounds,0);
 area.innerHTML='<div class="findWrap"><div class="findEmoji" id="fE"></div><div class="findWord" id="fW"></div><div class="cards" id="fC"></div></div>';
 const sayIt=()=>say('Q_'+target);
 function round(){busy=false;do{target=rnd(pool);}while(pool.length>1&&target===lastT);lastT=target;const [w,em]=wd(target);
  const others=ORDER.filter(x=>x!==target).sort(()=>Math.random()-.5).slice(0,2);const opts=[target,...others].sort(()=>Math.random()-.5);
  $('fE').textContent=em;$('fW').innerHTML=`<b>?</b>${esc(w.slice(1))}`;$('fC').innerHTML=opts.map(o=>`<button class="card vgate" data-l="${o}">${o}</button>`).join('');sayIt();}
 $('fC').addEventListener('click',e=>{const b=e.target.closest('.card');if(!b||busy||!G)return;const l=b.dataset.l;
  if(l===target){busy=true;b.classList.add('good');const [w]=wd(target);$('fW').innerHTML=`<b>${esc(w[0])}</b>${esc(w.slice(1))}`;const r2=b.getBoundingClientRect();burst(r2.left+r2.width/2,r2.top+r2.height/2,24,320,'star');SFX.ding();vib(30);
   say('L_'+target);r++;progDots(rounds,r);setTimeout(()=>{if(!G)return;if(r>=rounds)gameWin();else round();},2800);}
  else{b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');SFX.boop();vib(60);say('T_'+l);}});
 round();
 return {say:sayIt,tick(){}};
}

function matchGame(area){
 const pool=gamePool('match'),rounds=5;let r=0,target=null,busy=false,lastT=null;progDots(rounds,0);
 area.innerHTML='<div class="findWrap"><div class="bigGlyph" id="mG"></div><div class="cards" id="mC"></div></div>';
 const sayIt=()=>say('ML_'+target.toUpperCase());
 function round(){busy=false;do{target=rnd(pool);}while(pool.length>1&&target===lastT);lastT=target;$('mG').textContent=target.toUpperCase();
  const others=MOD.lower.items.filter(x=>x!==target).sort(()=>Math.random()-.5).slice(0,2);const opts=[target,...others].sort(()=>Math.random()-.5);
  $('mC').innerHTML=opts.map(o=>`<button class="card vgate" data-l="${o}">${o}</button>`).join('');sayIt();}
 $('mC').addEventListener('click',e=>{const b=e.target.closest('.card');if(!b||busy||!G)return;const l=b.dataset.l;
  if(l===target){busy=true;b.classList.add('good');const r2=b.getBoundingClientRect();burst(r2.left+r2.width/2,r2.top+r2.height/2,24,320,'star');SFX.ding();vib(30);
   say('L_'+target.toUpperCase());r++;progDots(rounds,r);setTimeout(()=>{if(!G)return;if(r>=rounds)gameWin();else round();},2800);}
  else{b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');SFX.boop();vib(60);say('T_'+l.toUpperCase());}});
 round();
 return {say:sayIt,tick(){}};
}
function countGame(area){
 const pool=gamePool('count').map(Number),rounds=5;let r=0,target=0,busy=false,lastT=null;progDots(rounds,0);
 area.innerHTML='<div class="findWrap"><div class="countBox" id="cB"></div><div class="cards" id="cC"></div></div>';
 const sayIt=()=>say('count');
 function round(){busy=false;do{target=rnd(pool);}while(pool.length>1&&target===lastT);lastT=target;const em=rnd(NOBJ.slice(1));
  $('cB').innerHTML=Array.from({length:target},()=>`<span>${em}</span>`).join('');
  const set=new Set([target]);let guard=0;while(set.size<3&&guard++<50)set.add(clamp(target+Math.round((Math.random()-.5)*6),1,10));
  for(let v=1;set.size<3;v++)set.add(v);
  const opts=[...set].sort(()=>Math.random()-.5);$('cC').innerHTML=opts.map(o=>`<button class="card vgate" data-n="${o}">${o}</button>`).join('');sayIt();}
 $('cC').addEventListener('click',e=>{const b=e.target.closest('.card');if(!b||busy||!G)return;const v=+b.dataset.n;
  if(v===target){busy=true;b.classList.add('good');SFX.ding();vib(30);
   const keys=Array.from({length:target},(_,i)=>'NN_'+(i+1)),offs=say(keys)||[],spans=[...$('cB').children];
   spans.forEach((sp,i)=>setTimeout(()=>{if(!G)return;sp.classList.add('hit');const r2=sp.getBoundingClientRect();burst(r2.left+r2.width/2,r2.top+r2.height/2,6,160,'sparkle');},(offs[i]||i*.9)*1000+80));
   const total=(offs[offs.length-1]||target*.9)*1000;r++;progDots(rounds,r);
   setTimeout(()=>{if(!G)return;if(r>=rounds)gameWin();else round();},total+1200);}
  else{b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');SFX.boop();vib(60);say('NN_'+v);}});
 round();
 return {say:sayIt,tick(){}};
}

/* ================= loop & boot ================= */
let last=performance.now();
function loop(now){
 const dt=Math.min(50,now-last)/1000;last=now;
 document.body.classList.toggle('talking',now<VOICE_END);
 try{if(P&&screen==='play'){updateAnim(now);checkIdle(now);renderBase(now);renderTop(now);}}catch(err){console.error(err);}
 try{if(G&&screen==='game'&&G.tick)G.tick(dt);}catch(err){console.error(err);}
 try{updateFx(dt);}catch(err){console.error(err);FX=[];}
 requestAnimationFrame(loop);}
sizeFx();renderMenu();requestAnimationFrame(loop);
loadAudio(S.lang).then(()=>loadAudio(S.lang==='fr'?'en':'fr'));
addEventListener('resize',()=>{sizeFx();if(screen==='play')layoutBoard();});
document.addEventListener('contextmenu',e=>{if(e.target&&e.target.tagName==='TEXTAREA')return;e.preventDefault();});
let fsTried=false;
document.addEventListener('pointerdown',()=>{ac();if(fsTried)return;fsTried=true;const d=document.documentElement;if(d.requestFullscreen&&!document.fullscreenElement){try{d.requestFullscreen().catch(()=>{});}catch(e){}}},{capture:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopVoice();});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}}
window.__abc={MOD,sample:sampleStroke,get talking(){return talking();},get VE(){return VOICE_END;},get P(){return P;},get S(){return S;},get AUD(){return AUD;},start:L=>startLetter(L)};
}
